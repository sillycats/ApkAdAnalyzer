name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 定位 Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          if [ -n "$SDK" ]; then echo "sdk.dir=$SDK" > local.properties; fi
          ls "$SDK/platforms" 2>/dev/null | tail -5 || echo "SDK platforms 需安装"

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 准备 Gradle（curl 下载以绕开 wrapper 的 Java 下载器）
        run: |
          set -e
          GRADLE_ZIP=/tmp/gradle-8.5-bin.zip
          GRADLE_DIR=/opt/gradle-8.5
          if [ ! -d "$GRADLE_DIR" ]; then
            echo "Downloading Gradle via curl..."
            curl -fsSL -o "$GRADLE_ZIP" \
              "https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip"
            ls -lh "$GRADLE_ZIP"
            mkdir -p /opt
            unzip -q "$GRADLE_ZIP" -d /opt
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"
          "$GRADLE_DIR/bin/gradle" --version | head -5

      - name: 构建 Debug 与 Release APK
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    # 仅在打 v* 标签时触发（例如 git tag v1.0 && git push --tags）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app-release.apk
          generate_release_notes: true