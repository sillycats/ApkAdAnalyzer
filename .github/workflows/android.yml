name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授权 Gradle Wrapper
        run: chmod +x gradlew

      - name: 诊断 Gradle 发行版源连通性
        run: |
          for url in \
            "https://services.gradle.org/distributions/gradle-8.5-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-8.5-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip" \
            "https://mirrors.aliyun.com/gradle/gradle-8.5-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.5-bin.zip" \
            "https://downloads.gradle-dn.com/distributions/gradle-8.5-bin.zip" \
            "https://futeng.github.io/gradle/gradle-8.5-bin.zip" \
            ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 15 "$url" 2>&1 || echo "FAIL")
            echo "==> $code  $url"
          done

      - name: 构建 Debug 与 Release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    # 仅在打 v* 标签时触发（例如 git tag v1.0 && git push --tags）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app-release.apk
          generate_release_notes: true